MeteorSettings:
  description: "Meteor detector channel settings"
  properties:
    inputFrequencyOffset:
      description: "Channel frequency offset in Hz"
      type: integer
      format: int64
    frequencyMode:
      description: >
        Frequency entry mode
          * 0 - Offset from device centre frequency
          * 1 - Absolute RF frequency
      type: integer
      minimum: 0
      maximum: 1
    frequency:
      description: "Absolute RF frequency in Hz"
      type: integer
      format: int64
      minimum: 0
    channelSampleRate:
      description: "Channel sample rate in samples per second: 100, 300, 1000, or 3000"
      type: integer
      minimum: 100
      maximum: 3000
    blobSensitivity:
      description: "Minimum integrated excess-power score for accepting a meteor blob; lower values are more sensitive"
      type: number
      format: float
      minimum: 10.0
      maximum: 10000.0
    maxDurationMS:
      description: "Maximum meteor detection duration in milliseconds"
      type: integer
      minimum: 1
      maximum: 60000
    detectionsTableColumnHidden:
      description: "Bit mask of hidden detection table columns"
      type: integer
      minimum: 0
    detectionBoxPaddingPixels:
      description: "Padding around detection overlay boxes in pixels"
      type: integer
      minimum: 0
      maximum: 100
    detectionLabelMode:
      description: >
        Detection overlay label placement
          * 0 - No label
          * 1 - Above the box
          * 2 - To the right of the box
      type: integer
      minimum: 0
      maximum: 2
    transmitterLatitude:
      description: "Radar transmitter latitude in decimal degrees"
      type: number
      format: double
      minimum: -90.0
      maximum: 90.0
    transmitterLongitude:
      description: "Radar transmitter longitude in decimal degrees"
      type: number
      format: double
      minimum: -180.0
      maximum: 180.0
    transmitterAzimuth:
      description: "Radar transmitter beam azimuth clockwise from true north in degrees"
      type: number
      format: float
      minimum: 0.0
      maximum: 360.0
    transmitterElevation:
      description: "Radar transmitter beam elevation above the horizon in degrees"
      type: number
      format: float
      minimum: -90.0
      maximum: 90.0
    transmitterBeamwidth:
      description: "Radar transmitter azimuth beamwidth in degrees; zero means unspecified"
      type: number
      format: float
      minimum: 0.0
      maximum: 360.0
    transmitterHPBW:
      description: "Radar transmitter elevation beamwidth in degrees; zero means unspecified"
      type: number
      format: float
      minimum: 0.0
      maximum: 180.0
    receiverLatitude:
      description: "Receive antenna latitude in decimal degrees"
      type: number
      format: double
      minimum: -90.0
      maximum: 90.0
    receiverLongitude:
      description: "Receive antenna longitude in decimal degrees"
      type: number
      format: double
      minimum: -180.0
      maximum: 180.0
    receiverPositionSet:
      description: "Whether the receive antenna position has been explicitly configured"
      type: integer
      minimum: 0
      maximum: 1
    antennaAzimuth:
      description: "Receive antenna azimuth clockwise from true north in degrees"
      type: number
      format: float
      minimum: 0.0
      maximum: 360.0
    antennaElevation:
      description: "Receive antenna elevation above the horizon in degrees"
      type: number
      format: float
      minimum: -90.0
      maximum: 90.0
    antennaBeamwidth:
      description: "Receive antenna half-power beamwidth in degrees; zero means unspecified"
      type: number
      format: float
      minimum: 0.0
      maximum: 360.0
    rotator:
      description: "Optional GS232Controller feature to follow, encoded as '<featureSetIndex>:<featureIndex>'"
      type: string
    showAntennaPatterns:
      description: "Show transmitter and receiver antenna-pattern polygons in Map features"
      type: integer
      minimum: 0
      maximum: 1
    mapMaxAltitudeKM:
      description: "Maximum altitude in kilometres used to project antenna-pattern polygons"
      type: number
      format: float
      minimum: 1.0
      maximum: 50000.0
    rgbColor:
      type: integer
    title:
      type: string
    streamIndex:
      description: "MIMO stream index. Not relevant when connected to a single Rx device."
      type: integer
      minimum: 0
    workspaceIndex:
      type: integer
      minimum: 0
    hidden:
      type: integer
      minimum: 0
      maximum: 1
    channelMarker:
      $ref: "/doc/swagger/include/ChannelMarker.yaml#/ChannelMarker"
    spectrumGUI:
      $ref: "/doc/swagger/include/GLSpectrum.yaml#/GLSpectrum"
    headSpectrumGUI:
      $ref: "/doc/swagger/include/GLSpectrum.yaml#/GLSpectrum"
    rollupState:
      $ref: "/doc/swagger/include/RollupState.yaml#/RollupState"
