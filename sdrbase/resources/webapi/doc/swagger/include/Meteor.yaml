MeteorSettings:
  description: "Meteor detector channel settings"
  properties:
    inputFrequencyOffset:
      description: "Channel frequency offset in Hz"
      type: integer
      format: int64
    frequencyMode:
      description: >
        Frequency entry mode
          * 0 - Offset from device centre frequency
          * 1 - Absolute RF frequency
      type: integer
      minimum: 0
      maximum: 1
    frequency:
      description: "Absolute RF frequency in Hz"
      type: integer
      format: int64
      minimum: 0
    channelSampleRate:
      description: "Channel sample rate in samples per second: 100, 300, 1000, or 3000"
      type: integer
      minimum: 100
      maximum: 3000
    powerLPFCutoff:
      description: "Power envelope low-pass cutoff in Hz"
      type: number
      format: float
      minimum: 0.1
      maximum: 1350.0
    detectionThresholdDB:
      description: "Detection threshold above background in dB"
      type: number
      format: float
      minimum: 1.0
      maximum: 60.0
    minDurationMS:
      description: "Minimum meteor detection duration in milliseconds"
      type: integer
      minimum: 1
      maximum: 10000
    maxDurationMS:
      description: "Maximum meteor detection duration in milliseconds"
      type: integer
      minimum: 1
      maximum: 60000
    maxFrequencyDrift:
      description: "Maximum allowed detection frequency drift in Hz"
      type: number
      format: float
      minimum: 0.0
      maximum: 1500.0
    detectionsTableColumnHidden:
      description: "Bit mask of hidden detection table columns"
      type: integer
      minimum: 0
    detectionBoxPaddingPixels:
      description: "Padding around detection overlay boxes in pixels"
      type: integer
      minimum: 0
      maximum: 100
    detectionLabelMode:
      description: >
        Detection overlay label placement
          * 0 - No label
          * 1 - Above the box
          * 2 - To the right of the box
      type: integer
      minimum: 0
      maximum: 2
    rgbColor:
      type: integer
    title:
      type: string
    streamIndex:
      description: "MIMO stream index. Not relevant when connected to a single Rx device."
      type: integer
      minimum: 0
    workspaceIndex:
      type: integer
      minimum: 0
    hidden:
      type: integer
      minimum: 0
      maximum: 1
    channelMarker:
      $ref: "/doc/swagger/include/ChannelMarker.yaml#/ChannelMarker"
    spectrumGUI:
      $ref: "/doc/swagger/include/GLSpectrum.yaml#/GLSpectrum"
    rollupState:
      $ref: "/doc/swagger/include/RollupState.yaml#/RollupState"
