SchedulerSettings:
  description: "Scheduler feature settings"
  properties:
    title:
      type: string
    rgbColor:
      type: integer
    workspaceIndex:
      type: integer
    rules:
      description: "Schedule rules"
      type: array
      items:
        $ref: "/doc/swagger/include/Scheduler.yaml#/SchedulerRule"
    rollupState:
      $ref: "/doc/swagger/include/RollupState.yaml#/RollupState"

SchedulerRule:
  description: "Scheduler rule"
  properties:
    id:
      description: "Stable rule identifier"
      type: string
    name:
      type: string
    enabled:
      description: "Enable this rule (1 for yes, 0 for no)"
      type: integer
    triggerType:
      description: >
        Rule trigger type
          * 0 - Time
          * 1 - Event
      type: integer
    time:
      description: "Rule time for time-based triggers"
      type: string
    dateUntil:
      description: "Optional end date for recurring time-based triggers"
      type: string
    recurrence:
      description: >
        Time trigger recurrence
          * 0 - Once
          * 1 - Daily
          * 2 - Monthly
      type: integer
    weekdayMask:
      description: "Weekday bit mask for daily recurrence (Mon bit 0 through Sun bit 6)"
      type: integer
    eventType:
      description: "Event type index for event-based triggers"
      type: integer
    eventSourceId:
      description: "Optional event source long ID; empty matches all sources"
      type: string
    eventDataRegex:
      description: "Optional regular expression matched against event data"
      type: string
    eventCount:
      description: "Number of matching events required before triggering actions"
      type: integer
    eventDelay:
      description: "Delay before executing event-triggered rule"
      type: integer
    eventDelayUnit:
      description: >
        Event delay unit
          * 0 - Seconds
          * 1 - Minutes
      type: integer
    duration:
      description: "Optional rule duration. 0 leaves started actions running."
      type: integer
    durationUnit:
      description: >
        Rule duration unit
          * 0 - Seconds
          * 1 - Minutes
      type: integer
    command:
      description: "Detached command to run when the rule fires"
      type: string
    speech:
      description: "Text to speak when the rule fires"
      type: string
    deviceSetActions:
      description: "Device-set actions executed when the rule fires"
      type: array
      items:
        $ref: "/doc/swagger/include/Scheduler.yaml#/SchedulerDeviceSetAction"
    channelActions:
      description: "Channel actions executed when the rule fires"
      type: array
      items:
        $ref: "/doc/swagger/include/Scheduler.yaml#/SchedulerChannelAction"
    featureActions:
      description: "Feature actions executed when the rule fires"
      type: array
      items:
        $ref: "/doc/swagger/include/Scheduler.yaml#/SchedulerFeatureAction"
    lastRun:
      description: "Last execution time"
      type: string

SchedulerDeviceSetAction:
  description: "Device-set action executed by a scheduler rule"
  properties:
    deviceSetIndex:
      type: integer
    deviceSetId:
      type: string
    presetGroup:
      description: "Preset group to load before running other device-set actions"
      type: string
    presetFrequency:
      description: "Preset centre frequency in Hz"
      type: integer
      format: int64
    presetDescription:
      description: "Preset description"
      type: string
    acquisitionAction:
      description: >
        Device acquisition action
          * 0 - No change
          * 1 - Start
          * 2 - Stop
      type: integer
    fileSinkAction:
      description: >
        File-sink action
          * 0 - No change
          * 1 - Start
          * 2 - Stop
      type: integer
    overrideCenterFrequency:
      description: "Set centre frequency before run/stop actions (1 for yes, 0 for no)"
      type: integer
    centerFrequency:
      description: "Device-set centre frequency in Hz"
      type: integer
      format: int64
    settings:
      description: "Optional device settings to patch when the rule fires"
      type: array
      items:
        $ref: "/doc/swagger/include/Scheduler.yaml#/SchedulerSettingValue"

SchedulerChannelAction:
  description: "Channel action executed by a scheduler rule"
  properties:
    deviceSetIndex:
      type: integer
    deviceSetId:
      type: string
    channelIndex:
      type: integer
    channelId:
      description: "Channel long ID"
      type: string
    action:
      description: >
        Channel action
          * 0 - No change
          * 6 - Start FileSink recording
          * 7 - Stop FileSink recording
          * 8 - Start SigMF recording
          * 9 - Stop SigMF recording
          * 10 - Transmit RTTY
          * 11 - Transmit PSK31
          * 12 - Transmit packet
          * 13 - Transmit IEEE 802.15.4
          * 14 - Transmit AIS
          * 15 - Run frequency scanner
          * 16 - Stop frequency scanner
          * 17 - Start radio astronomy sweep
          * 18 - Apply setting
      type: integer
    text:
      description: "Text payload for text-based transmit actions"
      type: string
    callsign:
      description: "Source callsign for packet transmit"
      type: string
    to:
      description: "Destination callsign for packet transmit"
      type: string
    via:
      description: "Via path for packet transmit"
      type: string
    data:
      description: "Data payload for binary or structured transmit actions"
      type: string
    settings:
      description: "Optional channel settings to patch when the rule fires"
      type: array
      items:
        $ref: "/doc/swagger/include/Scheduler.yaml#/SchedulerSettingValue"

SchedulerFeatureAction:
  description: "Feature action executed by a scheduler rule"
  properties:
    featureSetIndex:
      type: integer
    featureIndex:
      type: integer
    featureId:
      description: "Feature long ID"
      type: string
    action:
      description: >
        Feature action
          * 0 - No change
          * 1 - Start
          * 2 - Stop
          * 3 - Camera save image
          * 4 - Camera record video
          * 5 - Map or SkyMap find
          * 18 - Apply setting
      type: integer
    cameraFilename:
      description: "Optional Camera filename for save image or record video actions. Empty uses the Camera feature setting."
      type: string
    cameraRecordRawFits:
      description: "Save uncalibrated raw input image as FITS for Camera save image actions (1 for yes, 0 for no)"
      type: integer
    cameraRecordCalibratedMedia:
      description: "Save/record calibrated Camera media (1 for yes, 0 for no)"
      type: integer
    cameraRecordPostProcessedMedia:
      description: "Save/record post-processed Camera media with overlays (1 for yes, 0 for no)"
      type: integer
    cameraImageCount:
      description: "Number of images to save for Camera save image action. 0 records until stopped."
      type: integer
    cameraVideoDuration:
      description: "Video duration in seconds for Camera record video action. 0 records until stopped."
      type: integer
    findTarget:
      description: "Target string for Map or SkyMap find action."
      type: string
    settings:
      description: "Optional feature settings to patch when the rule fires"
      type: array
      items:
        $ref: "/doc/swagger/include/Scheduler.yaml#/SchedulerSettingValue"

SchedulerSettingValue:
  description: "Named setting value patched into a device, channel, or feature"
  properties:
    name:
      description: "Setting name"
      type: string
    value:
      description: "Setting value represented as text"
      type: string
    type:
      description: >
        Setting value type
          * 0 - String
          * 1 - Integer
          * 2 - Double
      type: integer
