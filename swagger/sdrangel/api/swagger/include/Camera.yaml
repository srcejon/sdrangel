CameraSettings:
  description: "Camera feature settings"
  properties:
    title:
      type: string
    rgbColor:
      type: integer
    cameraProtocol:
      description: "Camera protocol identifier (e.g. 'ALPACA', 'QT', 'video:')"
      type: string
    cameraId:
      description: "Camera device identifier"
      type: string
    cameraDescription:
      description: "Human-readable camera description"
      type: string
    resolutionWidth:
      description: "Capture resolution width in pixels"
      type: integer
    resolutionHeight:
      description: "Capture resolution height in pixels"
      type: integer
    framesPerSecond:
      description: "Capture frame rate in frames per second"
      type: integer
    captureMode:
      description: >
        Capture timing mode
          * 0 - Frame rate
          * 1 - Interval
      type: integer
    captureInterval:
      description: "Capture interval duration"
      type: number
      format: double
    captureIntervalUnits:
      description: >
        Units for captureInterval
          * 0 - Seconds
          * 1 - Minutes
      type: integer
    exposureTimeMs:
      description: "Exposure time in milliseconds (ALPACA cameras)"
      type: number
      format: double
    isoSensitivity:
      description: "ISO sensitivity value (ALPACA cameras)"
      type: integer
    alpacaDiscoveryEnabled:
      description: "Enable ALPACA device discovery (1 for yes, 0 for no)"
      type: integer
    alpacaApiLogEnabled:
      description: "Enable ALPACA API request logging (1 for yes, 0 for no)"
      type: integer
    alpacaHost:
      description: "Hostname or IP address of ALPACA camera server"
      type: string
    alpacaPort:
      description: "TCP port of ALPACA camera server"
      type: integer
    alpacaFocuserEnabled:
      description: "Enable ALPACA focuser control (1 for yes, 0 for no)"
      type: integer
    alpacaFocuserHost:
      description: "Hostname or IP address of ALPACA focuser server"
      type: string
    alpacaFocuserPort:
      description: "TCP port of ALPACA focuser server"
      type: integer
    alpacaFocuserDeviceNumber:
      description: "ALPACA device number for the focuser"
      type: integer
    alpacaFocusPosition:
      description: "Target focuser position in steps"
      type: integer
    alpacaFocusStepSize:
      description: "Focuser step size for focus adjustments"
      type: integer
    alpacaFilterWheelEnabled:
      description: "Enable ALPACA filter wheel control (1 for yes, 0 for no)"
      type: integer
    alpacaFilterWheelHost:
      description: "Hostname or IP address of ALPACA filter wheel server"
      type: string
    alpacaFilterWheelPort:
      description: "TCP port of ALPACA filter wheel server"
      type: integer
    alpacaFilterWheelDeviceNumber:
      description: "ALPACA device number for the filter wheel"
      type: integer
    alpacaFilterWheelPosition:
      description: "Filter wheel position index"
      type: integer
    cameraBinX:
      description: "Camera X binning factor"
      type: integer
    cameraBinY:
      description: "Camera Y binning factor"
      type: integer
    cameraNumX:
      description: "Camera ROI width in binned pixels (0 = full width)"
      type: integer
    cameraNumY:
      description: "Camera ROI height in binned pixels (0 = full height)"
      type: integer
    cameraStartX:
      description: "Camera ROI X origin in unbinned pixels"
      type: integer
    cameraStartY:
      description: "Camera ROI Y origin in unbinned pixels"
      type: integer
    cameraGain:
      description: "Camera gain index or numeric value (-1 = do not set)"
      type: integer
    cameraOffset:
      description: "Camera offset index or numeric value (-1 = do not set)"
      type: integer
    cameraReadoutMode:
      description: "Camera readout mode index"
      type: integer
    asiCoolerOn:
      description: "ASI cooler control: -1 do not set, 0 off, 1 on"
      type: integer
    asiTargetTemp:
      description: "ASI cooler target temperature in Celsius"
      type: integer
    asiUsbBandwidth:
      description: "ASI USB bandwidth setting (-1 = do not set)"
      type: integer
    asiHighSpeedMode:
      description: "ASI high-speed mode: -1 do not set, 0 off, 1 on"
      type: integer
    asiAutoExposureGain:
      description: "Enable ASI auto exposure/gain in frame-rate mode (1 for yes, 0 for no)"
      type: integer
    autoExposureGainEnabled:
      description: "Enable SDRangel software auto exposure/gain control loop (1 for yes, 0 for no)"
      type: integer
    autoExposureGainMode:
      description: >
        Software auto exposure/gain adjustment mode
          * 0 - Exposure first
          * 1 - Gain first
          * 2 - Exposure only
          * 3 - Gain only
      type: integer
    autoExposureTargetPercentile:
      description: "Image percentile used as the exposure target measurement"
      type: number
      format: double
    autoExposureTargetBrightness:
      description: "Target brightness percentage for the selected percentile"
      type: number
      format: double
    autoExposureMaxChangePercent:
      description: "Maximum exposure/gain change per control step, as a percentage"
      type: number
      format: double
    autoExposureMinMs:
      description: "Minimum software auto-exposure time in milliseconds"
      type: number
      format: double
    autoExposureMaxMs:
      description: "Maximum software auto-exposure time in milliseconds"
      type: number
      format: double
    autoExposureMinGain:
      description: "Minimum software auto-gain value"
      type: integer
    autoExposureMaxGain:
      description: "Maximum software auto-gain value"
      type: integer
    asiColorImageType:
      description: >
        ASI colour image type
          * 0 - RGB24
          * 1 - RAW16
          * 2 - RAW8
      type: integer
    saveImage:
      description: "Save captured frames as still images (1 for yes, 0 for no)"
      type: integer
    imageFileName:
      description: "File path template for saved still images"
      type: string
    saveVideo:
      description: "Record captured frames to a video file (1 for yes, 0 for no)"
      type: integer
    videoFileCameraPath:
      description: "File path for file-based camera video source"
      type: string
    streamUrl:
      description: "URL for stream: camera source"
      type: string
    streamUrlHistory:
      description: "Previously opened stream URLs for the stream: camera source"
      type: array
      items:
        type: string
    streamBufferingSeconds:
      description: "Decoded media buffering in seconds for stream: camera sources before playback starts or resumes after a stall"
      type: number
      format: double
    imageFileCameraPaths:
      description: "Ordered image file list for images: image sequence camera source"
      type: array
      items:
        type: string
    videoFileName:
      description: "File path for recorded video output"
      type: string
    recordingOutputDirectoryUri:
      description: "Android Storage Access Framework document-tree URI used for completed recordings"
      type: string
    videoCodec:
      description: >
        Codec used for saved video recordings
          * 0 - H.264
          * 1 - H.265
      type: integer
    videoRecordBitrateKbps:
      description: "Saved video bitrate in kbit/s; 0 selects automatic bitrate from frame size and frame rate"
      type: integer
    recordRawFits:
      description: "Save uncalibrated raw input still images as FITS files (1 for yes, 0 for no)"
      type: integer
    recordCalibratedMedia:
      description: "Save calibrated/debayered still images and videos (1 for yes, 0 for no)"
      type: integer
    recordFilteredMedia:
      description: "Save filtered image-processor still images and videos (1 for yes, 0 for no)"
      type: integer
    recordPostProcessedMedia:
      description: "Save post-processed still images and videos with overlays (1 for yes, 0 for no)"
      type: integer
    keogramEnabled:
      description: "Build and save a 24-hour keogram from calibrated frames (1 for yes, 0 for no)"
      type: integer
    keogramFileName:
      description: "File basename for saved keograms (.jpg or .png)"
      type: string
    keogramDirection:
      description: >
        Keogram sample direction
          * 0 - Horizontal
          * 1 - Vertical
      type: integer
    keogramDayMode:
      description: >
        Keogram 24-hour window
          * 0 - Midnight to midnight
          * 1 - Midday to midday
      type: integer
    keogramSamplePeriodMinutes:
      description: "Keogram sample period in minutes"
      type: integer
    keogramShowPreview:
      description: "Show live keogram preview (1 for yes, 0 for no)"
      type: integer
    youtubeStreamEnabled:
      description: "Stream captured video to YouTube (1 for yes, 0 for no)"
      type: integer
    youtubeStreamUrl:
      description: "YouTube RTMP/RTMPS ingest URL"
      type: string
    youtubeStreamKey:
      description: "YouTube stream key"
      type: string
    youtubeStreamPostProcessed:
      description: "Stream post-processed frames instead of calibrated frames (1 for yes, 0 for no)"
      type: integer
    youtubeStreamBitrateKbps:
      description: "YouTube stream video bitrate in kbit/s"
      type: integer
    youtubeStreamFps:
      description: "YouTube stream frame rate"
      type: integer
    youtubeStreamWidth:
      description: "YouTube stream output width in pixels; 0 = source width"
      type: integer
    youtubeStreamHeight:
      description: "YouTube stream output height in pixels; 0 = source height"
      type: integer
    videoHwAcceleration:
      description: "Prefer hardware-accelerated video encoding when available (1 for yes, 0 for no)"
      type: integer
    videoLoop:
      description: "Loop file-camera video input (1 for yes, 0 for no)"
      type: integer
    videoPlaybackRate:
      description: "Playback rate multiplier for file-camera video input"
      type: number
      format: double
    videoPlaybackAudioOffsetMs:
      description: "Preview audio offset in milliseconds for video-camera playback; negative plays audio earlier"
      type: integer
    videoPreRecordBufferSeconds:
      description: "Seconds of live frames to buffer and prepend when video recording starts"
      type: integer
    imageRecordLimit:
      description: "Number of still images to save before disabling image recording; 0 = unlimited"
      type: integer
    videoRecordLimitSeconds:
      description: "Seconds of video to record before disabling video recording; 0 = unlimited"
      type: integer
    stackEnabled:
      description: "Enable frame stacking (1 for yes, 0 for no)"
      type: integer
    stackFrameCount:
      description: "Number of frames to stack"
      type: integer
    stackMethod:
      description: >
        Frame stacking method
          * 0 - Average
          * 1 - Median
          * 2 - Sigma-clipped average
          * 3 - Lucky sharp average
          * 4 - HDR
      type: integer
    stackDurationMode:
      description: >
        Average stack duration mode
          * 0 - Rolling frame window
          * 1 - Continuous integration with a bounded review history
      type: integer
    stackHdrAlgorithm:
      description: >
        HDR stacking algorithm
          * 0 - Debevec
          * 1 - Robertson
          * 2 - Mertens
      type: integer
    stackHdrExposureCount:
      description: "Number of HDR exposure times to use"
      type: integer
    stackHdrExposureTimesMs:
      description: "HDR exposure times in milliseconds"
      type: array
      items:
        type: number
        format: double
    stackAlignmentMethod:
      description: >
        Frame alignment method
          * 0 - None
          * 1 - Phase correlation
          * 2 - Star centroid matching
      type: integer
    stackDisplayMode:
      description: >
        Stack preview display mode
          * 0 - Stacked image
          * 1 - Single history frame
          * 2 - History tile sheet
      type: integer
    stackDisplayFrameIndex:
      description: "History frame index to preview when stackDisplayMode is single history frame"
      type: integer
    stackRejectBadFrames:
      description: "Reject frames that are poor candidates for stacking (1 for yes, 0 for no)"
      type: integer
    scaleEnabled:
      description: "Scale calibrated/stacked frames after stacking (1 for yes, 0 for no)"
      type: integer
    scaleWidth:
      description: "Scaled output width in pixels; 0 keeps the source width"
      type: integer
    scaleHeight:
      description: "Scaled output height in pixels; 0 keeps the source height"
      type: integer
    scaleKeepAspectRatio:
      description: "Fit the scaled output inside the requested size without stretching (1 for yes, 0 for no)"
      type: integer
    scaleJustification:
      description: "Placement of the fitted image when keep-aspect scaling leaves padding: 0 center, 1 left, 2 right, 3 top, 4 bottom"
      type: integer
    stackDarkFileName:
      description: "Dark calibration frame file path"
      type: string
    stackFlatFileName:
      description: "Flat calibration frame file path"
      type: string
    stackBiasFileName:
      description: "Bias calibration frame file path"
      type: string
    latitude:
      description: "Camera latitude in degrees"
      type: number
      format: float
    longitude:
      description: "Camera longitude in degrees"
      type: number
      format: float
    altitude:
      description: "Camera altitude in metres"
      type: number
      format: float
    positionSync:
      description: "Sync camera location from main settings (1 for yes, 0 for no)"
      type: integer
    owmAPIKey:
      description: "OpenWeatherMap API key"
      type: string
    azimuth:
      description: "Camera pointing azimuth in degrees"
      type: number
      format: float
    elevation:
      description: "Camera pointing elevation in degrees"
      type: number
      format: float
    roll:
      description: "Camera roll about optical axis in degrees"
      type: number
      format: float
    rotator:
      description: "Rotator feature identifier as featureSetIndex:featureIndex"
      type: string
    autoguide:
      description: "Autoguide: trim the followed rotator's azimuth/elevation offsets to zero the plate-solve pointing error (1 for enabled)"
      type: integer
    autoguideGain:
      description: "Fraction of the measured pointing residual corrected per solve (0.05 to 1)"
      type: number
      format: float
    autoguideDeadbandDeg:
      description: "On-sky residual in degrees below which no correction is sent; 0 for automatic (rotator tolerance/step and measured solve noise)"
      type: number
      format: float
    autoguideMaxCorrectionDeg:
      description: "Largest single on-sky correction per axis in degrees; 0 for automatic (solved field of view / 4)"
      type: number
      format: float
    fov:
      description: "Camera field of view in degrees"
      type: number
      format: float
    fovMode:
      description: >
        Field-of-view input mode
          * 0 - Direct FoV
          * 1 - Calculate from sensor size and focal length
          * 2 - Calculate from camera-reported sensor size and focal length
      type: integer
    fovSensorWidthMm:
      description: "Sensor width in millimetres when calculating FoV"
      type: number
      format: double
    fovSensorHeightMm:
      description: "Sensor height in millimetres when calculating FoV"
      type: number
      format: double
    fovFocalLengthMm:
      description: "Focal length in millimetres when calculating FoV"
      type: number
      format: double
    lensProjection:
      description: >
        Lens projection model
          * 0 - Rectilinear
          * 1 - Equidistant
          * 2 - Equisolid
      type: integer
    lensCenterOffsetX:
      description: "Principal point X offset in pixels from image centre"
      type: number
      format: double
    lensCenterOffsetY:
      description: "Principal point Y offset in pixels from image centre"
      type: number
      format: double
    lensDistortionK1:
      description: "Radial distortion coefficient"
      type: number
      format: double
    lensMirror:
      description: "Image is horizontally mirrored relative to the sky (1 for up-looking all-sky camera or telescope star diagonal). Plate solving and sky overlays account for the reflection."
      type: integer
    playbackProjectionEnabled:
      description: "Use playback content rectangle as the optical image area for video, stream and image sequence sources"
      type: integer
    playbackProjectionX:
      description: "Playback optical content rectangle left position in pixels"
      type: integer
    playbackProjectionY:
      description: "Playback optical content rectangle top position in pixels"
      type: integer
    playbackProjectionWidth:
      description: "Playback optical content rectangle width in pixels"
      type: integer
    playbackProjectionHeight:
      description: "Playback optical content rectangle height in pixels"
      type: integer
    postProcessWhiteBalanceMode:
      description: >
        Post-processing white balance mode
          * 0 - Off
          * 1 - Auto
          * 2 - Manual
      type: integer
    postProcessWhiteBalanceRedGain:
      description: "Manual white balance red channel gain: 0.1 to 8.0"
      type: number
      format: double
    postProcessWhiteBalanceGreenGain:
      description: "Manual white balance green channel gain: 0.1 to 8.0"
      type: number
      format: double
    postProcessWhiteBalanceBlueGain:
      description: "Manual white balance blue channel gain: 0.1 to 8.0"
      type: number
      format: double
    postProcessWhiteBalanceHighlightProtection:
      description: "Amount to reduce manual white-balance gains toward neutral in highlights"
      type: number
      format: double
    postProcessUseCuda:
      description: "Use OpenCV CUDA acceleration for supported camera processing steps (1 for yes, 0 for no)"
      type: integer
    postProcessUnwarp:
      description: "Unwarp fisheye images using lens settings (1 for yes, 0 for no)"
      type: integer
    histogramStretch:
      description: >
        Histogram stretch mode
          * 0 - Off
          * 1 - Linear
          * 2 - Gamma
          * 3 - Asinh
          * 4 - Log
          * 5 - CLAHE
      type: integer
    histogramStretchBlackPoint:
      description: "Histogram stretch black point normalized to 0..1"
      type: number
      format: double
    histogramStretchWhitePoint:
      description: "Histogram stretch white point normalized to 0..1"
      type: number
      format: double
    histogramStretchGamma:
      description: "Histogram stretch gamma exponent"
      type: number
      format: double
    histogramStretchAsinhStrength:
      description: "Asinh stretch strength"
      type: number
      format: double
    histogramStretchLogStrength:
      description: "Log stretch strength"
      type: number
      format: double
    postProcessGreyscale:
      description: "Convert post-processed image to greyscale (1 for yes, 0 for no)"
      type: integer
    saturation:
      description: "Saturation multiplier: 0.0 to 3.0"
      type: number
      format: double
    gamma:
      description: "Gamma correction exponent: 0.1 to 3.0"
      type: number
      format: double
    brightness:
      description: "Brightness adjustment: -100.0 to 100.0"
      type: number
      format: double
    contrast:
      description: "Contrast multiplier: 0.1 to 3.0"
      type: number
      format: double
    gaussianBlur:
      description: "Gaussian blur kernel radius: 0 (off) to 15"
      type: integer
    medianBlur:
      description: "Median blur kernel radius: 0 (off) to 15"
      type: integer
    sharpen:
      description: "Sharpening amount: 0.0 to 3.0"
      type: number
      format: double
    edgeDisplayMode:
      description: >
        Edge display mode
          * 0 - Overlay
          * 1 - Edges only
      type: integer
    sobelEdge:
      description: "Sobel edge blend amount: 0.0 to 3.0"
      type: number
      format: double
    cannyEdge:
      description: "Canny edge blend amount: 0.0 to 3.0"
      type: number
      format: double
    flipX:
      description: "Flip image horizontally (1 for yes, 0 for no)"
      type: integer
    flipY:
      description: "Flip image vertically (1 for yes, 0 for no)"
      type: integer
    imageRotation:
      description: "Rotate image clockwise after flips, in whole degrees from -360 to 360"
      type: integer
      minimum: -360
      maximum: 360
    invertColors:
      description: "Invert all colour channels (1 for yes, 0 for no)"
      type: integer
    overlayDateTime:
      description: "Draw current date and time on each frame (1 for yes, 0 for no)"
      type: integer
    dateTimeColor:
      description: "Colour for the date/time overlay text as 0xRRGGBB integer"
      type: integer
    dateTimeFormat:
      description: "QDateTime::toString format string for the date/time overlay (e.g. 'yyyy-MM-dd hh:mm:ss')"
      type: string
    dateTimeUtc:
      description: "Display the date/time overlay in UTC rather than local time (1 for yes, 0 for no)"
      type: integer
    dateTimePosX:
      description: "X pixel offset from the left edge for the date/time overlay: 0 to 4096"
      type: integer
    dateTimePosY:
      description: "Y pixel offset from the top edge for the date/time overlay: 0 to 4096 (0 = auto bottom)"
      type: integer
    overlayText:
      description: "Draw custom HTML text on each frame (1 for yes, 0 for no)"
      type: integer
    equatorialGrid:
      description: "Draw equatorial sky grid overlay (1 for yes, 0 for no)"
      type: integer
    equatorialGridColor:
      description: "Equatorial grid colour as 0xRRGGBB integer"
      type: integer
    altAzGrid:
      description: "Draw alt-az sky grid overlay (1 for yes, 0 for no)"
      type: integer
    altAzGridColor:
      description: "Alt-az grid colour as 0xRRGGBB integer"
      type: integer
    constellation:
      description: "Draw constellation overlay (1 for yes, 0 for no)"
      type: integer
    constellationColor:
      description: "Constellation overlay colour as 0xRRGGBB integer"
      type: integer
    constellationOverlay:
      description: >
        Constellation overlay
          * 0 - Ursa Major
          * 1 - Orion
          * 2 - Crux
          * 3 - Auriga
          * 4 - Bootes
          * 5 - Canis Major
          * 6 - Cassiopeia
          * 7 - Cygnus
          * 8 - Gemini
          * 9 - Leo
          * 10 - Lyra
          * 11 - Pegasus
          * 12 - Sagittarius
          * 13 - Scorpius
          * 14 - Taurus
      type: integer
    messier:
      description: "Draw Messier object overlay (1 for yes, 0 for no)"
      type: integer
    messierColor:
      description: "Messier overlay colour as 0xRRGGBB integer"
      type: integer
    messierMaxMagnitude:
      description: "Only overlay Messier objects at least this bright (visual magnitude; 10.5 shows all 110)"
      type: number
      format: double
    messierDetect:
      description: "Photometrically check each Messier position and dim objects not detected in the frame (1 for yes, 0 for no)"
      type: integer
    trackObjects:
      description: "Draw tracked object overlay (1 for yes, 0 for no)"
      type: integer
    trackObjectMinElevation:
      description: "Minimum elevation in degrees for tracked objects"
      type: number
      format: double
    trackObjectMaxRangeKm:
      description: "Maximum line-of-sight range in km for tracked objects; 0 disables range filtering"
      type: number
      format: double
    trackObjectLabelDisplay:
      description: >
        Tracked object label display mode
          * 0 - Always
          * 1 - Only when the projected item is close to a detected object
      type: integer
    trackObjectLabelDetectionRadius:
      description: "Maximum pixel distance from a detected object center for showing tracked object labels"
      type: number
      format: double
    trackObjectColor:
      description: "Tracked object label colour as 0xRRGGBB integer"
      type: integer
    trackObjectFontScale:
      description: "Tracked object label font point size"
      type: number
      format: double
    trackObjectTrails:
      description: "Draw persistent trails for tracked overlay objects (1 for yes, 0 for no)"
      type: integer
    trackObjectHeatMap:
      description: "Draw a persistent heat map from tracked overlay object positions (1 for yes, 0 for no)"
      type: integer
    trackObjectRange:
      description: "Append tracked object line-of-sight range in km to labels (1 for yes, 0 for no)"
      type: integer
    gridLabelFontFamily:
      description: "Font family for sky grid labels"
      type: string
    gridLabelFontScale:
      description: "Font point size for sky grid labels"
      type: number
      format: double
    overlayTextString:
      description: "HTML text content to render on the frame"
      type: string
    overlayTextColor:
      description: "Colour for the text overlay as 0xRRGGBB integer"
      type: integer
    overlayTextFontFamily:
      description: "Font family name for the text overlay (empty = system default)"
      type: string
    overlayTextFontScale:
      description: "Font point size for the text overlay: 4.0 to 144.0"
      type: number
      format: double
    overlayTextPosX:
      description: "X pixel offset from the left edge for the text overlay: 0 to 4096"
      type: integer
    overlayTextPosY:
      description: "Y pixel offset from the top edge for the text overlay: 0 to 4096 (0 = auto bottom)"
      type: integer
    diffMask:
      description: "Show pixel differences from the previous frame (1 for yes, 0 for no)"
      type: integer
    diffThreshold:
      description: "Threshold for diff-mask binary classification: 0 to 255"
      type: integer
    diffMaskOpenSize:
      description: "Kernel radius for morphological open on diff mask before accumulation: 0 to 20"
      type: integer
    dilationSize:
      description: "Kernel radius for diff-mask dilation: 0 to 20"
      type: integer
    diffMaskHistoryFrames:
      description: "Number of diff masks to accumulate with bitwise OR: 1 to 120"
      type: integer
    diffMaskCloseSize:
      description: "Kernel radius for morphological close on the accumulated diff mask: 0 to 20"
      type: integer
    overlayFontFamily:
      description: "Font family for detector overlays"
      type: string
    overlayFontScale:
      description: "Font point size for detector overlays"
      type: number
      format: double
    detectionRoiX:
      description: "Detection region-of-interest X origin in pixels: 0 to 4096"
      type: integer
    detectionRoiY:
      description: "Detection region-of-interest Y origin in pixels: 0 to 4096"
      type: integer
    detectionRoiWidth:
      description: "Detection region-of-interest width in pixels (0 = full width)"
      type: integer
    detectionRoiHeight:
      description: "Detection region-of-interest height in pixels (0 = full height)"
      type: integer
    showDetectionRoi:
      description: "Show detection ROI rectangle (1 for yes, 0 for no)"
      type: integer
    motionDetect:
      description: "Enable MOG2 background subtractor for motion detection (1 for yes, 0 for no)"
      type: integer
    motionBackgroundSubtractor:
      description: >
        Motion background subtractor
          * 0 - MOG2
          * 1 - KNN
      type: integer
    motionMaskView:
      description: >
        Motion mask debug view
          * 0 - Off
          * 1 - Raw
          * 2 - Thresholded
          * 3 - Opened
          * 4 - Closed
          * 5 - Final
      type: integer
    motionHistory:
      description: "Background subtractor history length in frames: 1 to 5000"
      type: integer
    motionVarThreshold:
      description: "Variance threshold for MOG2 foreground classification: 1.0 to 200.0"
      type: number
      format: double
    motionLearningRate:
      description: "Background subtractor learning rate: -1.0 auto, otherwise 0.0 to 1.0"
      type: number
      format: double
    motionConfirmFrames:
      description: "Consecutive motion frames required before reporting"
      type: integer
    motionDownscale:
      description: "Downscale factor for the motion detection path"
      type: number
      format: double
    motionDetectShadows:
      description: "Enable MOG2 shadow detection (1 for yes, 0 for no)"
      type: integer
    motionOpenSize:
      description: "Kernel radius for motion-mask morphological open: 0 to 20"
      type: integer
    motionCloseSize:
      description: "Kernel radius for motion-mask morphological close: 0 to 20"
      type: integer
    motionPersistenceFrames:
      description: "Keep last motion bounding boxes for this many frames after motion disappears: 0 to 120"
      type: integer
    motionBoxColor:
      description: "Bounding box colour for motion contours as 0xRRGGBB integer"
      type: integer
    minContourArea:
      description: "Minimum contour area in square pixels to draw: 0 to 10000"
      type: integer
    showMotionExclusionRects:
      description: "Show motion exclusion rectangles (1 for yes, 0 for no)"
      type: integer
    motionExclusionRects:
      description: "Full-resolution rectangles excluded from diff/motion detection"
      type: array
      items:
        $ref: "http://swgserver:8081/api/swagger/include/Camera.yaml#/CameraRect"
    cloudDetect:
      description: "Enable cloud detection (1 for yes, 0 for no)"
      type: integer
    cloudMode:
      description: >
        Cloud classification path
          * 0 - Auto (day or night from overall frame brightness)
          * 1 - Day (red/blue ratio)
          * 2 - Night (sky-background deviation)
      type: integer
    cloudDebugView:
      description: >
        Cloud detector debug view
          * 0 - Off
          * 1 - Background
          * 2 - Signal
          * 3 - Thresholded
          * 4 - Final
          * 5 - Texture
      type: integer
    cloudColor:
      description: "Cloud mask overlay tint colour as 0xAARRGGBB integer"
      type: integer
    cloudShowOverlay:
      description: "Tint cloud-classified regions on the preview image (1 for yes, 0 for no)"
      type: integer
    cloudDayThreshold:
      description: "Day path: minimum red/blue ratio classified as cloud: 0.0 to 2.0"
      type: number
      format: double
    cloudTextureThreshold:
      description: "Day path: fine-scale texture level above which a region cannot be cloud (rejects roofs/trees); 0 disables: 0 to 255"
      type: integer
    cloudNightThreshold:
      description: "Dark night path: how much brighter than the surrounding sky a region must be to classify as cloud: 0 to 255"
      type: integer
    cloudBackgroundBlur:
      description: "Night path: radius used to estimate the sky background, in downscaled pixels: 1 to 128"
      type: integer
    cloudOpenSize:
      description: "Kernel radius for cloud-mask morphological open: 0 to 20"
      type: integer
    cloudCloseSize:
      description: "Kernel radius for cloud-mask morphological close: 0 to 20"
      type: integer
    cloudDownscale:
      description: "Downscale factor for the cloud detection path: 1.0, 0.5, 0.25 or 0.125"
      type: number
      format: double
    cloudUpdateIntervalFrames:
      description: "Recompute the cloud mask every this many frames: 1 to 600"
      type: integer
    cloudFilterStars:
      description: "Drop star detections whose centroid falls inside the cloud mask (1 for yes, 0 for no)"
      type: integer
    cloudFilterMotion:
      description: "Suppress motion boxes that substantially overlap the cloud mask (1 for yes, 0 for no)"
      type: integer
    cloudMotionOverlapThreshold:
      description: "Cloud overlap fraction at which a motion box is suppressed: 0.0 to 1.0"
      type: number
      format: double
    cloudEventThreshold:
      description: "Coverage percentage at which a Scheduler coverage-high event is emitted (low again 10 points below): 0 to 100"
      type: number
      format: double
    cloudEdgeMarginPercent:
      description: "Exclude a margin this percentage of the frame in from the sky-region edge (fisheye rim / vignette / foreground); 0 disables: 0 to 25"
      type: number
      format: double
    cloudDayRelativeMargin:
      description: "Day path: how much whiter (red/blue ratio) than the clear sky at the same elevation counts as cloud; 0 disables: 0 to 1"
      type: number
      format: double
    cloudMinElevation:
      description: "Exclude sky below this elevation in degrees from cloud evaluation (needs the lens pose), so coverage tracks the usable sky; 0 disables: 0 to 90"
      type: number
      format: double
    cloudMaskSunMoon:
      description: "Exclude the projected sun (day) / moon (night) so their bright bloom is not classified as cloud (1 for yes, 0 for no)"
      type: integer
    cloudStarSense:
      description: "At night, unmark detected cloud that predicted catalog stars are visible through; requires camera position, capture time and a calibrated lens model (1 for yes, 0 for no)"
      type: integer
    cloudStarSenseMagnitude:
      description: "Faintest catalog star magnitude checked by star-visibility sensing: 0 to 6"
      type: number
      format: double
    cloudUseReference:
      description: "Compare against the saved per-camera clear-sky reference: veto static quirks, cue deviations, exclude learned foreground (1 for yes, 0 for no)"
      type: integer
    cloudAutoReference:
      description: "Auto-learn the clear-sky reference from verified-clear frames (1 for yes, 0 for no)"
      type: integer
    cloudUseDetectionRoi:
      description: "Restrict cloud detection to the shared detection RoI; 0 evaluates the whole image (1 for yes, 0 for no)"
      type: integer
    cloudSunMoonRadiusDeg:
      description: "Maximum angular radius in degrees the sun/moon exclusion grows to; the mask sizes itself to the actual glare bloom up to this cap: 0 to 45"
      type: number
      format: double
    starDetect:
      description: "Enable star detection (1 for yes, 0 for no)"
      type: integer
    starThreshold:
      description: "Threshold for star residual image"
      type: integer
    starBackgroundBlur:
      description: "Radius used to estimate smooth sky background"
      type: integer
    starMinArea:
      description: "Minimum star blob area in pixels"
      type: integer
    starMaxArea:
      description: "Maximum star blob area in pixels"
      type: integer
    starMaxAspectRatio:
      description: "Maximum accepted star blob aspect ratio"
      type: number
      format: double
    starDebugView:
      description: >
        Star detector debug view
          * 0 - Off
          * 1 - Background
          * 2 - Residual
          * 3 - Thresholded
          * 4 - Final
      type: integer
    starColor:
      description: "Detected star overlay colour as 0xRRGGBB integer"
      type: integer
    plateSolve:
      description: "Enable plate solving from detected stars (1 for yes, 0 for no)"
      type: integer
    plateSolveMaxMagnitude:
      description: "Faintest catalog star magnitude to consider"
      type: number
      format: double
    plateSolveMinMatches:
      description: "Minimum star matches for a successful plate solve"
      type: integer
    plateSolveMatchRadius:
      description: "Maximum acquisition/coarse match radius in pixels"
      type: number
      format: double
    plateSolveFinalMatchRadius:
      description: "Maximum final accepted match radius in pixels"
      type: number
      format: double
    plateSolveSearchRadius:
      description: "Search radius around current pointing estimate in degrees"
      type: number
      format: double
    plateSolveFovTolerance:
      description: "Allowed FoV refinement tolerance as a percentage of the entered FoV; 0 pins FoV to the entered value"
      type: number
      format: double
    plateSolveStartMode:
      description: >
        Plate solve start mode
          * 0 - Blind
          * 1 - FoV
          * 2 - FoV/elevation
          * 3 - FoV/azimuth/elevation
          * 4 - FoV/azimuth/elevation/roll
          * 5 - FoV/azimuth/elevation/roll/lens
          * 6 - Current settings only
      type: integer
    plateSolveLabelMode:
      description: >
        Plate solve label mode
          * 0 - None
          * 1 - Name
          * 2 - Name/magnitude
          * 3 - Name/magnitude/spectral type
      type: integer
    plateSolveUseCaptureDateTime:
      description: "Use frame capture date/time for plate solving; when 0 use plateSolveDateTime (1 for yes, 0 for no)"
      type: integer
    plateSolveDateTime:
      description: "Fixed date/time for plate solving recorded media"
      type: string
    plateSolveDateTimeUtc:
      description: "Treat fixed plate solve date/time as UTC rather than local time (1 for yes, 0 for no)"
      type: integer
    plateSolveUseDownloadedCatalog:
      description: "Prefer downloaded HYG catalog when available (1 for yes, 0 for no)"
      type: integer
    plateSolveCatalogSource:
      description: >
        Plate solve catalog source
          * 0 - Auto
          * 1 - HYG
          * 2 - Siril SPCC Gaia
          * 3 - Siril Gaia DR3 Astrometric
      type: integer
    plateSolveApplyMode:
      description: >
        Plate solve apply mode
          * 0 - Azimuth/elevation
          * 1 - Azimuth/elevation/roll
          * 2 - Azimuth/elevation/roll/FoV
          * 3 - Azimuth/elevation/roll/FoV/lens
      type: integer
    starCatalogDiskCacheSizeGb:
      description: "Maximum star catalog disk cache size in GB; 0 = unlimited"
      type: integer
    overlaySpectrum:
      description: "Overlay the spectrum view image on each frame (1 for yes, 0 for no)"
      type: integer
    spectrumDevice:
      description: "Long ID of the device whose spectrum view to overlay (e.g. 'R0 HackRF')"
      type: string
    spectrumOffsetX:
      description: "X offset in pixels for the top-left corner of the spectrum overlay: -4096 to 4096"
      type: integer
    spectrumOffsetY:
      description: "Y offset in pixels for the top-left corner of the spectrum overlay: -4096 to 4096"
      type: integer
    spectrumScale:
      description: "Scale factor applied to the spectrum image before compositing: 0.1 to 4.0"
      type: number
      format: double
    yoloEnabled:
      description: "Run YOLO ONNX inference and draw bounding boxes (1 for yes, 0 for no)"
      type: integer
    yoloModelPath:
      description: "Path to the YOLO .onnx or Android LiteRT .tflite model used for scaled/full-image inference"
      type: string
    yoloTileModelPath:
      description: "Optional path to the YOLO .onnx or Android LiteRT .tflite model used for tiled inference. If empty, yoloModelPath is used"
      type: string
    yoloLabelsPath:
      description: "Path to a plain-text file with one class name per line"
      type: string
    yoloConfThreshold:
      description: "Minimum detection confidence to keep: 0.0 to 1.0"
      type: number
      format: double
    yoloNmsThreshold:
      description: "IoU threshold for non-maximum suppression: 0.0 to 1.0"
      type: number
      format: double
    yoloDisappearDebounce:
      description: "Seconds an object class must remain undetected before it is reported as disappeared: 0.0 to 60.0"
      type: number
      format: double
    yoloBoxColor:
      description: "Default bounding box colour as 0xRRGGBB integer (used when no per-class colour is set)"
      type: integer
    yoloTileLargeImages:
      description: "Tile images larger than the YOLO model input size before inference (1 for yes, 0 for no)"
      type: integer
    yoloTileOverlapPercent:
      description: "Tile overlap percentage for large-image YOLO inference"
      type: integer
    yoloIgnoredClassNames:
      description: "YOLO class labels to ignore after detection"
      type: array
      items:
        type: string
    yoloDnnTarget:
      description: >
        YOLO inference backend/target
          * 0 - CPU
          * 1 - CUDA FP32
          * 2 - CUDA FP16
          * 3 - TensorRT FP32
          * 4 - TensorRT FP16
          * 5 - OpenCV Vulkan
          * 6 - LiteRT CPU (Android .tflite models)
          * 7 - LiteRT GPU delegate (Android .tflite models)
      type: integer
    audioMute:
      description: "Silence captured camera audio (1 for yes, 0 for no)"
      type: integer
    audioPreviewVolume:
      description: "Audio preview volume in percent (0 to 100)"
      type: integer
    audioDeviceName:
      description: "Name of the audio output device (empty = system default)"
      type: string
    whiteBalanceMode:
      description: "Qt camera white balance mode index (0 = Auto)"
      type: integer
    exposureCompensation:
      description: "Qt camera exposure compensation in EV steps: -2.0 to 2.0"
      type: number
      format: double
    focusMode:
      description: "Qt camera focus mode index (0 = Auto)"
      type: integer
    focusDistance:
      description: "Qt camera normalised focus distance: 0.0 (near) to 1.0 (far/infinity)"
      type: number
      format: double
    zoomFactor:
      description: "Qt camera hardware optical zoom factor (1.0 = no zoom)"
      type: number
      format: double
    thermalDecoder:
      description: "Radiometric UVC decoder: 0 off, 1 auto, 2 Thermal Master P2, 3 TOPDON TC001"
      type: integer
    thermalPalette:
      description: "Thermal palette: 0 white hot, 1 black hot, 2 iron, 3 inferno, 4 turbo, 5 viridis"
      type: integer
    thermalUnits:
      description: "Displayed thermal units: 0 Celsius, 1 Fahrenheit"
      type: integer
    thermalAutoRange:
      description: "Automatically determine thermal display limits from percentiles (1 for yes, 0 for no)"
      type: integer
    thermalMinimumC:
      description: "Manual thermal palette minimum in Celsius"
      type: number
      format: double
    thermalMaximumC:
      description: "Manual thermal palette maximum in Celsius"
      type: number
      format: double
    thermalAutoLowPercentile:
      description: "Lower percentile used for automatic thermal display ranging"
      type: number
      format: double
    thermalAutoHighPercentile:
      description: "Upper percentile used for automatic thermal display ranging"
      type: number
      format: double
    thermalAutoRangeSmoothing:
      description: "Thermal automatic-range response factor from 0.01 to 1.0"
      type: number
      format: double
    thermalMarkerEnabled:
      description: "Display the thermal measurement marker (1 for yes, 0 for no)"
      type: integer
    thermalMarkerX:
      description: "Thermal marker horizontal position normalized from 0 to 1"
      type: number
      format: double
    thermalMarkerY:
      description: "Thermal marker vertical position normalized from 0 to 1"
      type: number
      format: double
    thermalShowMinMax:
      description: "Display minimum and maximum temperature markers (1 for yes, 0 for no)"
      type: integer
    thermalChartEnabled:
      description: "Add marker measurements to the thermal chart (1 for yes, 0 for no)"
      type: integer
    thermalChartHistorySeconds:
      description: "Maximum thermal chart history in seconds"
      type: integer
    thermalChartSampleIntervalMs:
      description: "Minimum interval between thermal chart samples in milliseconds"
      type: integer
    useReverseAPI:
      description: "Synchronize with reverse API (1 for yes, 0 for no)"
      type: integer
    reverseAPIAddress:
      type: string
    reverseAPIPort:
      type: integer
    reverseAPIFeatureSetIndex:
      type: integer
    reverseAPIFeatureIndex:
      type: integer
    rollupState:
      $ref: "http://swgserver:8081/api/swagger/include/RollupState.yaml#/RollupState"
    workspaceIndex:
      type: integer

CameraReport:
  description: "Camera feature report"
  properties:
    runningState:
      type: integer
      description: >
        Running state
          * 0 - not started
          * 1 - idle
          * 2 - running
          * 3 - error
    captureDateTime:
      description: "ISO-8601 capture date/time for the current frame, or an empty string if unavailable"
      type: string
    detectedObjectClasses:
      description: "Distinct object detector class names detected in the current frame"
      type: array
      items:
        type: string
    motionDetected:
      description: "Whether motion is currently detected (1 for yes, 0 for no)"
      type: integer
    cloudCoveragePercent:
      description: "Percentage of the evaluated sky classified as cloud in the latest analysed frame"
      type: number
      format: float
    cloudCoverageValid:
      description: "Whether cloudCoveragePercent is valid (1 for yes, 0 for no)"
      type: integer
    thermalValid:
      description: "Whether the latest frame contains valid radiometric temperature data (1 for yes, 0 for no)"
      type: integer
    thermalDecoderName:
      description: "Radiometric decoder used for the latest thermal frame"
      type: string
    thermalMarkerTemperatureC:
      description: "Temperature in Celsius at the configured marker in the latest thermal frame"
      type: number
      format: float
    thermalMinimumC:
      description: "Minimum temperature in Celsius in the latest thermal frame"
      type: number
      format: float
    thermalMaximumC:
      description: "Maximum temperature in Celsius in the latest thermal frame"
      type: number
      format: float
    thermalMeanC:
      description: "Mean temperature in Celsius in the latest thermal frame"
      type: number
      format: float

CameraActions:
  description: "Camera feature actions"
  properties:
    run:
      type: integer
      description: >
        Set the plugin running state
          * 0 - idle
          * 1 - run
    saveImage:
      description: "Save image to file"
      type: object
      properties:
        filename:
          description: "Filename for the image"
          type: string
        recordRawFits:
          description: "Save uncalibrated raw input image as FITS (1 for yes, 0 for no)"
          type: integer
        recordCalibratedMedia:
          description: "Save calibrated/debayered image (1 for yes, 0 for no)"
          type: integer
        recordFilteredMedia:
          description: "Save filtered image-processor image (1 for yes, 0 for no)"
          type: integer
        recordPostProcessedMedia:
          description: "Save post-processed image with overlays (1 for yes, 0 for no)"
          type: integer
        images:
          description: "Number of images to save (0 - Unlimited)"
          type: integer
    recordVideo:
      description: "Record video to file"
      type: object
      properties:
        filename:
          description: "Filename for the video"
          type: string
        recordCalibratedMedia:
          description: "Record calibrated/debayered video (1 for yes, 0 for no)"
          type: integer
        recordFilteredMedia:
          description: "Record filtered image-processor video (1 for yes, 0 for no)"
          type: integer
        recordPostProcessedMedia:
          description: "Record post-processed video with overlays (1 for yes, 0 for no)"
          type: integer
        duration:
          description: "Duration of recording (0 - Unlimited)"
          type: integer

CameraRect:
  description: "Rectangle in image pixel coordinates"
  properties:
    x:
      type: integer
    y:
      type: integer
    width:
      type: integer
    height:
      type: integer
